[project]
name = "uploader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = [
    "black>=26.3.1",
    "doclayout-yolo>=0.0.4",
    "langchain>=1.2.18",
    "langchain-aws>=1.4.6",
    "langchain-openai>=1.6.2",
    "langgraph>=1.1.10",
    "langgraph-checkpoint>=4.2.0",
    "numpy>=2.0.0",
    "paddleocr>=3.7.0",
    # Paddle's CUDA wheels pin CUDA 12 on Linux, which torch's CUDA 13 build
    # rules out; only this machine's platform gets the GPU build.
    "paddlepaddle-gpu>=3.4.0; sys_platform == 'win32'",
    "paddlepaddle>=3.3.1; sys_platform != 'win32'",
    "pillow>=11.0.0",
    "pydantic>=2.12.5",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    # Declared directly, though yomitoku already needs them: [tool.uv.sources]
    # below only redirects the project's own dependencies to the CUDA index.
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.1",
    "yomitoku>=0.15.0",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

# Torch comes from the CUDA 13.0 wheel index: the layout models run on the GPU.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# Paddle ships its CUDA builds from its own index only; PyPI carries CPU wheels alone.
[[tool.uv.index]]
name = "paddle-cu129"
url = "https://www.paddlepaddle.org.cn/packages/stable/cu129/"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
paddlepaddle-gpu = { index = "paddle-cu129" }

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

# Unit tests import the OCR module as a top-level package, as the app does.
[tool.pytest.ini_options]
testpaths = ["Test/Unit"]
pythonpath = ["."]

# Strict typing covers the code written under it; the older pipelines are
# followed for their types but not reported on.
[tool.mypy]
python_version = "3.12"
strict = true
files = ["OcrModule/LinearMD", "OcrModule/TextJoin.py"]

[[tool.mypy.overrides]]
module = ["OcrModule.Blocked.*", "OcrModule.Linear.*", "OcrModule.LlmHelper"]
ignore_errors = true

# Layout frameworks that ship no type information.
[[tool.mypy.overrides]]
module = ["doclayout_yolo.*", "yomitoku.*", "paddleocr.*", "paddle.*", "fitz.*"]
ignore_missing_imports = true
